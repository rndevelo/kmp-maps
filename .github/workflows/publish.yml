name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    # Publishing needs iOS Kotlin/Native artifacts, so it must run on macOS. The fork has no
    # self-hosted runner registered; GitHub-hosted macOS keeps releases executable from the tag.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEYS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEYS_PASSWORD }}
