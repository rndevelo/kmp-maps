name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  publish:
    # Publishing needs iOS Kotlin/Native artifacts, so it must run on macOS. The fork has no
    # self-hosted runner registered; GitHub-hosted macOS keeps releases executable from the tag.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Publish
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_IN_MEMORY_KEY_B64 }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%s' "$SIGNING_KEY_B64" | base64 --decode)"
          ./gradlew publishToMavenCentral
